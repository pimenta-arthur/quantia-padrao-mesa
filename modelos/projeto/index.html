<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa · Projeto novo</title>
<!-- Padrão Mesa v3.0 · MODELO DE PROJETO. Copie a pasta, troque o título e a marca, e acrescente as funções em
     funcoes/<cod>.js (molde em ../funcao/_funcao.js). O núcleo vem de ../../nucleo/ (no projeto, copie nucleo/ para padrao/). -->
<script>try { if (localStorage.getItem("quantia-tema") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../nucleo/base.css">
<link rel="stylesheet" href="../../nucleo/painel.css">
<link rel="stylesheet" href="../../nucleo/mesa.css">
<!-- estilos de cada função: <link rel="stylesheet" href="funcoes/<cod>.css"> -->
</head>
<body>
<div class="mesa" data-insp="aberto">
  <header class="t-topo">
    <a class="t-marca" href="./" title="Início do projeto">NOME DO PROJETO</a>
    <form class="t-cmd" id="m-cmd" role="search" autocomplete="off">
      <label class="t-prompt" for="cmd">CMD&gt;</label>
      <input id="cmd" name="cmd" placeholder="EXE · EXE 2 · MESA" spellcheck="false">
      <button type="submit">GO</button>
      <span class="t-cmd-msg" id="m-cmd-msg" aria-live="polite"></span>
    </form>
    <span class="t-pg" id="t-pg"></span>
    <span class="t-hora"><span class="num" data-relogio></span> BRT</span>
    <button class="t-btn" type="button" data-tema>Tema claro</button>
  </header>
  <nav class="m-fn" id="m-fn" aria-label="Funções"></nav>
  <nav class="m-telas" id="m-telas" aria-label="Telas da função"></nav>
  <div class="t-fita" data-fita aria-label="Cotações"></div>
  <main class="m-area" id="m-area" tabindex="-1"></main>
  <aside class="m-insp" aria-label="Inspetor">
    <div class="m-insp-cab"><h2 id="insp-titulo">Alertas</h2><span><button type="button" id="insp-limpar" title="Voltar aos alertas">Alertas</button> <button type="button" id="insp-fechar" title="Fechar o inspetor (tecla I)">×</button></span></div>
    <div class="m-insp-corpo" id="insp-corpo"></div>
  </aside>
  <footer class="t-status"><span>Dados fictícios</span><span>Rodada: data e hora da última publicação</span><span class="t-atalhos">0–9 funções · ← → telas · ⇧1–9 tela direto · Esc mesa · / comando · I inspetor · ? método · T tema</span></footer>
</div>
<!-- padrão v2.0 -->
<script src="../../nucleo/graficos.js"></script>
<script src="../../nucleo/componentes.js"></script>
<script src="../../nucleo/terminal.js"></script>
<!-- núcleo da mesa e funções (a ordem das funções define ⇧2–5) -->
<script src="../../nucleo/mesa.js"></script>
<script src="funcoes/exemplo.js"></script>
<script>Mesa.iniciar();</script>
</body>
</html>
